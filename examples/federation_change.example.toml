# Federation Change Configuration
# ================================
#
# This file describes a federation membership change and the strategy for
# migrating funds from old federation addresses to the new one.
#
# A federation change is an infrastructure-level operation: the HSM pool
# and threshold change affects every account index simultaneously. The
# migration tool discovers all active accounts from the database and
# applies the new federation across all of them — there is no per-user
# or per-account configuration.
#
# Usage:
#   cargo run --example federation_migration -- --config examples/federation_change.example.toml
#
# The tool reads this file alongside the same .env used by the web app
# (HSM tokens, database, RPC endpoints). It walks you through each step
# with a confirmation prompt before anything irreversible happens.

# ---------------------------------------------------------------------------
# New federation
# ---------------------------------------------------------------------------
[federation]

# Threshold for the new federation (m in m-of-n).
# This example keeps a 3-of-3 policy while rotating one signer.
threshold = 3

# Signers in the new federation, listed by their HSM token label.
# These labels must match APP_HSM_{N}_LABEL values from your .env file.
# The tool validates that every listed token was discovered at startup.
#
# This example rotates from [app-1, app-2, app-3] to [app-1, app-3, app-4]:
# HSM #2 is removed, HSM #4 is added, threshold stays at 3-of-3.
signers = [
    "asterism-pkcs11-app-1",
    "asterism-pkcs11-app-3",
    "asterism-pkcs11-app-4",
]

# ---------------------------------------------------------------------------
# Migration strategy
# ---------------------------------------------------------------------------
[migration]

# How to sweep funds from old federation addresses to the new federation.
#
# Available strategies:
#
#   "account-for-account"  - All accounts swept in a SINGLE transaction.
#                            Inputs from every account index, one output per
#                            account at the matching index in the new
#                            federation. Maximum fee efficiency. Best when
#                            on-chain common-ownership disclosure is acceptable
#                            (institutional custody).
#
#   "account-for-account-batched"
#                          - One transaction PER account by default, giving
#                            each account an independently verifiable on-chain
#                            migration. Accounts with balances below
#                            `small_account_threshold` are bundled into a
#                            single transaction (outputs still account-
#                            segregated). RECOMMENDED DEFAULT for exchanges
#                            and fund managers — balances audit/compliance
#                            needs against fee efficiency for small accounts.
#
# NOTE: the Elements (`--elements`) migration currently implements
# "account-for-account" only (all accounts in one fee-account-pays
# transaction). "account-for-account-batched" for Elements (small-account
# bundling + chained confidential fee-change) is the next milestone.
strategy = "account-for-account"

# Only used when strategy = "account-for-account-batched".
# Accounts with a total balance below this threshold (in satoshis) are
# bundled into a single "small accounts" sweep transaction instead of
# getting their own individual transaction. Outputs in the bundled
# transaction are still account-segregated — each small account gets its
# own output at the correct account index.
# small_account_threshold = 100000

# Account index of the internal/house account that pays migration fees.
# This account MUST exist and have sufficient balance to cover all
# transaction fees before the migration begins. For
# account-for-account-batched, this account is migrated last so it can
# fund fees for all preceding transactions.
fee_account_idx = 99

# Fee rate in sat/vB for the sweep transactions.
# The tool shows fee estimates before asking for confirmation.
fee_rate_sat_per_vb = 2

# ---------------------------------------------------------------------------
# Elements (optional)
# ---------------------------------------------------------------------------
[elements]

# Whether to also migrate the Elements wallet alongside the Bitcoin wallet.
# When true (and run with `--elements`), the tool performs the same federation
# change on the Elements side using the client-side wollet model: it records
# the new federation, then sweeps all accounts' captured UTXOs into the new
# federation in one fee-account-pays transaction (no daemon wallets).
enabled = true

# Whether to rotate the SLIP-77 master blinding key for the new federation.
# Rotating prevents signers removed from the federation from deriving
# blinding keys for future transactions (since backup bundles contain the
# blinding key). Set to false if you need accounting continuity.
rotate_blinding_key = false
