[package]
name = "test-app-pkcs11"
version = "0.1.0"
edition = "2024"
description = "Test web app exercising emvault-pkcs11: customer-facing wallets backed by a 3-of-3 federation of emulated HSMs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmikeska/test-app-pkcs11"
publish = false

[dependencies]
# EmVault — consumed through the `emvault` facade. `pkcs11` +
# `elements` reproduce the old `emvault-pkcs11 { features = ["elements"] }`
# wiring (HSM signing over Bitcoin + Elements); `dev-signer` adds the dev-only
# HSM helpers (DevBackend, init_dev_token) and implies `pkcs11`. The
# `setup_dev_federation` helper is bypassed on purpose — see src/hsm.rs.
# `esplora` adds the nodeless Esplora/Waterfalls chain backend
# (`emvault::core::esplora`), selected at runtime via `APP_CHAIN_BACKEND`.
# TEMPORARY (reorg-reconciliation 0.6.0 work): bumped 0.3 -> 0.5 so the local
# `[patch.crates-io]` backend tree (which carries `evicted_txids` + `reorg_rebuilt`
# + rebuild-on-reorg) is consumed. Greg lands the single emvault 0.6.0 republish
# (D6); at that point set this to "0.6" and drop the patch below.
emvault = { version = "0.6", features = ["pkcs11", "elements", "dev-signer", "esplora", "electrum", "elements-electrum", "elements-esplora"] }

# Chain + Elements stacks are NOT pinned here — their types cross the EmVault
# API, so we consume them through the ecosystem's canonical re-exports:
#   Bitcoin:  emvault::core::{bitcoin, miniscript, bdk_wallet,
#                             bdk_bitcoind_rpc, bitcoincore_rpc}
#   Elements: emvault::elements::{elements, elements_miniscript, lwk_wollet}
# Single source of truth, no version drift between the app and the library.
base64 = "0.22"

# Server-side QR rendering for the address detail page.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Web stack
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6.11", features = ["fs", "trace"] }

# Sessions (cookie-backed, Postgres-stored).
#
# Version pairing: tower-sessions 0.14 + tower-sessions-sqlx-store 0.15 share
# `tower-sessions-core 0.14`. tower-sessions 0.15 bumped its core to 0.15 but
# tower-sessions-sqlx-store hasn't followed yet (matches test-app-xpub).
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
time = "0.3"

# Templating
askama = { version = "0.16", features = ["serde_json"] }
askama_web = { version = "0.16", features = ["axum-0.8"] }

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# Auth
argon2 = "0.5.3"
password-hash = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }

# Misc
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
axum-extra = { version = "0.12.6", features = ["form"] }
toml = "0.8"

[dev-dependencies]
# Enables `emvault::elements::testkit::SoftwareSigner` for the Elements
# end-to-end integration test (node + Postgres backed). Cargo unions this with
# the normal `emvault` dep, so the test build gets pkcs11 + elements +
# dev-signer + test-utils.
emvault = { version = "0.6", features = ["test-utils"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Web-handler signatures naturally collect many extractors and many fields.
too_many_arguments = "allow"
module_name_repetitions = "allow"
# Async handlers commonly take owned types by value (axum extractors).
needless_pass_by_value = "allow"
# Background text refers to PostgreSQL — backtick noise hurts readability.
doc_markdown = "allow"
# A list-item continuation indented to align with prose reads better than
# rewriting the source for clippy.
doc_overindented_list_items = "allow"

# ── Construction-site override ───────────────────────────────────────────────
# The chain-stack re-exports (e.g. emvault::core::{bdk_wallet, bdk_bitcoind_rpc,
# bitcoincore_rpc}) are not in the published 0.1.1 yet, so build the apps against
# the local ecosystem tree. Patching the `emvault` facade cascades to the local
# emvault-core/-xpub/-elements via its path deps. Remove once those land on
# crates.io and the version bump is published.
[patch.crates-io]
emvault = { path = "../emvault" }
# esplora-rs 0.3.0 (unpublished) carries the waterfalls `TxSeen.v: -1` spend
# sentinel fix; patched in until Greg publishes 0.3.0. Remove on publish.
esplora-rs = { path = "../../esplora-rs" }
